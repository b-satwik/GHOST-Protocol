# REGISTRY POLICY & RULES:
# 1. This registry is strictly APPROVAL-GATED.
# 2. Only sources with `approved: true` AND `collection_allowed: true` AND a valid `url` will be collected.
# 3. External or live .onion targets must NEVER be added or approved automatically by the crawler.
# 4. Search engines (Ahmia, Google, Bing) and CTI APIs (VirusTotal, HIBP) are REFERENCE_ONLY and MUST NOT be crawled as corpus data.
# 5. Volatile or unverified dark web targets (Torch, Haystak, ransomware blogs) remain PENDING_REVIEW (approved: false).
# 6. Collection must remain passive, text/metadata focused, and research-oriented. No stealer logs, raw credential dumps, or victim file downloads.

